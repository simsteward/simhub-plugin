services:
  loki:
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/local-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yml:ro
      - ${GRAFANA_STORAGE_PATH:-S:/sim-steward-grafana-storage}/loki:/loki
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  loki-gateway:
    image: nginx:1.27-alpine
    depends_on:
      loki:
        condition: service_healthy
    ports:
      - "3500:3500"
    env_file:
      - path: .env.observability.local
        required: false
    environment:
      - LOKI_PUSH_TOKEN=${LOKI_PUSH_TOKEN:-}
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3500/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.2.0
    depends_on:
      loki:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ${GRAFANA_STORAGE_PATH:-S:/sim-steward-grafana-storage}/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

  data-api:
    build: ./data-api
    ports:
      - "8080:8080"
    environment:
      - SIMSTEWARD_DB_PATH=/data/simsteward.db
    volumes:
      - ${GRAFANA_STORAGE_PATH:-S:/sim-steward-grafana-storage}/data-api:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Claude Code native OpenTelemetry ingest. Receives OTLP from Claude Code
  # (.claude/settings.json → http://localhost:4317), exposes :8889 for the local
  # prometheus scrape, and forwards metrics+logs to Grafana Cloud. Grafana Cloud creds
  # are read from the repo .env; missing creds are non-fatal (local Prometheus still works).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    env_file:
      - path: ../../.env
        required: false
    ports:
      - "4317:4317"   # OTLP gRPC (Claude Code → collector)
      - "4318:4318"   # OTLP HTTP
      - "13133:13133" # health_check
    # NOTE: :8889 (Prometheus text endpoint) is intentionally NOT published to the host —
    # SimHubWPF.exe already binds host :8889. The local `prometheus` service scrapes it
    # over the compose network (otel-collector:8889); the Grafana Cloud path uses the OTLP
    # gateway, not this port. So no host publish is needed and the SimHub clash is avoided.
    expose:
      - "8889"
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:13133"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Local Prometheus — scrapes the collector (:8889) so claude_code.* metrics are
  # queryable offline via the provisioned "Prometheus Local" datasource (prometheus_local).
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      - otel-collector
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${GRAFANA_STORAGE_PATH:-S:/sim-steward-grafana-storage}/prometheus:/prometheus

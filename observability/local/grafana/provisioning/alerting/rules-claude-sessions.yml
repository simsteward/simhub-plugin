apiVersion: 1

groups:
  - orgId: 1
    name: Claude Code Session Health
    folder: Log Sentinel
    interval: 1m
    rules:

      - uid: session-abandoned
        title: Session Abandoned
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 5400, to: 0 }
            datasourceUid: loki_local
            model:
              datasource: { type: loki, uid: loki_local }
              editorMode: code
              expr: 'count_over_time({app="claude-dev-logging", component="lifecycle"} | json | hook_type="session-start" [90m])'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 5400, to: 0 }
            datasourceUid: loki_local
            model:
              datasource: { type: loki, uid: loki_local }
              editorMode: code
              expr: 'count_over_time({app="claude-dev-logging", component="lifecycle"} | json | hook_type="session-end" [90m])'
              instant: true
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A > 0 && $B == 0"
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        annotations:
          summary: Claude session started but no session-end in 90 minutes
          description: A session-start was detected with no corresponding session-end — session may be hung, abandoned, or crashed
        labels:
          alertname: session-abandoned
          severity: warn
          trigger_tier: t1

      - uid: claude-error-spike
        title: Claude Error Spike
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki_local
            model:
              datasource: { type: loki, uid: loki_local }
              editorMode: code
              expr: 'count_over_time({app="claude-dev-logging", level="ERROR"} [5m])'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: B
              conditions:
                - evaluator: { params: [4], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 5+ ERROR entries in claude-dev-logging in 5 minutes
          description: Elevated error rate in Claude session logging — possible API or tool failure
        labels:
          alertname: claude-error-spike
          severity: warn
          trigger_tier: t1

      - uid: permission-flood
        title: Permission Flood
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki_local
            model:
              datasource: { type: loki, uid: loki_local }
              editorMode: code
              expr: 'count_over_time({app="claude-dev-logging", component="user"} | json | hook_type="permission-request" [5m])'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: B
              conditions:
                - evaluator: { params: [9], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 10+ permission-request hook events in 5 minutes
          description: Possible permission configuration problem or tool permission loop — Claude is repeatedly asking for approval
        labels:
          alertname: permission-flood
          severity: warn
          trigger_tier: t1

      - uid: subagent-explosion
        title: Subagent Explosion
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: loki_local
            model:
              datasource: { type: loki, uid: loki_local }
              editorMode: code
              expr: 'count_over_time({app="claude-dev-logging", component="agent"} | json | hook_type="subagent-start" [60m])'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: B
              conditions:
                - evaluator: { params: [19], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Subagent spawn count exceeded 20 in 60 minutes
          description: Unusually high subagent spawning — possible recursive agent loop or over-parallelization
        labels:
          alertname: subagent-explosion
          severity: warn
          trigger_tier: t2

      - uid: mcp-service-errors
        title: MCP Service Errors
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki_local
            model:
              datasource: { type: loki, uid: loki_local }
              editorMode: code
              expr: 'count_over_time({app="claude-dev-logging", component=~"mcp-.*", level="ERROR"} [10m])'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: B
              conditions:
                - evaluator: { params: [4], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 5+ MCP call failures in 10 minutes
          description: MCP server appears to be failing — multiple ERROR-level hook events from mcp-* components
        labels:
          alertname: mcp-service-errors
          severity: warn
          trigger_tier: t1

      - uid: tool-loop-detected
        title: Tool Loop Detected
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: loki_local
            model:
              datasource: { type: loki, uid: loki_local }
              editorMode: code
              expr: 'count_over_time({app="claude-dev-logging"} | json | is_retry="true" [30m])'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: B
              conditions:
                - evaluator: { params: [4], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 5+ identical tool retries in 30 minutes
          description: Possible stuck agent — repeated identical tool invocations detected via retry hash matching
        labels:
          alertname: tool-loop-detected
          severity: warn
          trigger_tier: t2

      - uid: session-zero-output
        title: Session Zero Output
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: loki_local
            model:
              datasource: { type: loki, uid: loki_local }
              editorMode: code
              expr: 'count_over_time({app="claude-token-metrics"} | json | total_output_tokens="0" [60m])'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: B
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Token metric entry with zero output tokens logged
          description: A claude-token-metrics entry was recorded with total_output_tokens=0 — possible silent failure or empty response
        labels:
          alertname: session-zero-output
          severity: warn
          trigger_tier: t1

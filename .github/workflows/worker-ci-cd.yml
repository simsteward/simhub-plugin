name: Worker CI/CD

# Both jobs live in one file so `needs:` can actually gate the deploy on the
# test job — GitHub Actions has no way to depend on a job defined in a
# different workflow file. worker-test always runs on a worker/** change;
# deploy only runs on a push to main (and only after worker-test succeeds),
# so the very first automated deploy is guaranteed to already contain
# whatever security fixes landed alongside this workflow.

on:
  push:
    branches: ["*"]
    paths:
      - "worker/**"
  pull_request:
    branches: [main, master]
    paths:
      - "worker/**"

permissions:
  contents: read

jobs:
  worker-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

  deploy:
    needs: worker-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
